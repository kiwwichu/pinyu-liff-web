<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>快樂小狗｜管理員登入</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;overflow-x:hidden}body{margin:0;background:#f3f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#24313f}
.wrap{max-width:520px;margin:auto;padding:36px 18px}.head{background:#48a2e8;color:white;padding:20px;border-radius:18px 18px 0 0}
.card{background:white;padding:28px 20px;text-align:center;border-radius:0 0 18px 18px;box-shadow:0 8px 28px #0001}
#googleButton{display:flex;justify-content:center;margin:22px 0}.err{color:#a12d2d;white-space:pre-wrap}.muted{color:#6b7785;line-height:1.6}
.login-transition{position:fixed;inset:0;z-index:100;display:none;place-items:center;width:100%;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:hidden;background:linear-gradient(145deg,#56b1ed,#318fd1);color:#fff;text-align:center}.signing-in{height:100dvh;overflow:hidden}.signing-in .login-transition{display:grid}.signing-in .wrap{visibility:hidden}.loading-card{width:min(100%,340px);max-width:100%;padding:30px 20px;border:1px solid #ffffff55;border-radius:24px;background:#ffffff20;box-shadow:0 18px 55px #15598644;backdrop-filter:blur(14px)}.paw-loader{position:relative;width:88px;max-width:100%;height:58px;margin:0 auto 20px}.paw{position:absolute;font-size:29px;opacity:.35;animation:pawWalk 1.2s infinite ease-in-out}.paw:nth-child(1){left:0;bottom:0}.paw:nth-child(2){left:30px;top:0;animation-delay:.2s}.paw:nth-child(3){right:0;bottom:0;animation-delay:.4s}@keyframes pawWalk{0%,100%{transform:translateY(7px) scale(.9);opacity:.3}45%{transform:translateY(-5px) scale(1.1);opacity:1}}.loading-title{font-size:clamp(20px,6vw,22px);font-weight:900}.loading-note{margin-top:8px;font-size:clamp(14px,4vw,16px);line-height:1.6;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 style="margin:0">快樂小狗 Pinyu</h1><div>內部管理後台</div></div>
  <div class="card">
    <h2>管理員登入</h2>
    <p class="muted">使用「系統使用者」中登記的 Google 帳號登入。<br>登入不會取得試算表共用權限。</p>
    <div id="googleButton"></div>
    <div id="loading" class="muted" style="display:none">正在驗證並開啟後台…</div>
    <div id="error" class="err"></div>
  </div>
</div>
<div class="login-transition" role="status" aria-live="polite"><div class="loading-card"><div class="paw-loader"><span class="paw">🐾</span><span class="paw">🐾</span><span class="paw">🐾</span></div><div class="loading-title">正在開啟管理後臺</div><div class="loading-note">帳號驗證中，請稍候，不需要重新登入。</div></div></div>

<form id="loginForm" method="post" style="display:none">
  <input id="credential" name="credential" type="hidden">
  <input name="action" value="googleAdminLogin" type="hidden">
</form>

<script src="./config.js"></script>
<script>
const cfg=window.PINYU_ADMIN_LOGIN||{}, form=document.getElementById('loginForm');
document.addEventListener('DOMContentLoaded',()=>{
  if(!cfg.GOOGLE_CLIENT_ID||!cfg.APPS_SCRIPT_WEB_APP_URL){
    document.getElementById('error').textContent='請先在 config.js 填入 Client ID 與 Apps Script /exec 網址。'; return;
  }
  form.action=cfg.APPS_SCRIPT_WEB_APP_URL;
  waitGoogle();
});
function waitGoogle(){
  if(!window.google||!google.accounts||!google.accounts.id){setTimeout(waitGoogle,100);return;}
  google.accounts.id.initialize({
    client_id:cfg.GOOGLE_CLIENT_ID,
    callback:r=>{
      if(!r||!r.credential){document.getElementById('error').textContent='沒有取得 Google 登入憑證。';return;}
      document.body.classList.add('signing-in');
      document.getElementById('error').textContent='';
      document.getElementById('loading').style.display='block';
      document.getElementById('credential').value=r.credential;
      setTimeout(()=>form.submit(),180);
    }
  });
  google.accounts.id.renderButton(document.getElementById('googleButton'),{
    theme:'outline',size:'large',shape:'pill',text:'signin_with',width:300,locale:'zh_TW'
  });
}
</script>
</body></html>
